<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d110f">
<title>CLIENTFLOW</title>
<style>
:root{--bg:#0d110f;--line:#29332d;--text:#eef4ef;--muted:#9aa89e;--green:#b8f36b;--red:#ff8585;--shadow:0 18px 50px #0005}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(1000px 600px at 80% -15%,#26372b 0%,transparent 60%),var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea,select{background:#111814;border:1px solid #344139;border-radius:9px;padding:10px 12px;color:var(--text);outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:#8bbd5b;box-shadow:0 0 0 3px #9ddf581a}
.loading{display:grid;place-items:center;min-height:100vh;color:var(--muted)}
.auth-wrap{display:grid;place-items:center;min-height:100vh;padding:20px}
.auth-card{width:min(400px,100%);background:linear-gradient(145deg,#19211c,#141a16);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow)}
.auth-brand{font-weight:800;letter-spacing:.15em;font-size:13px;color:var(--green);margin-bottom:6px}
.auth-title{font-size:22px;font-weight:750;letter-spacing:-.03em;margin-bottom:22px}
.auth-tabs{display:flex;gap:4px;background:#0f1411;padding:4px;border-radius:10px;margin-bottom:18px}
.auth-tabs button{flex:1;padding:8px;border-radius:7px;color:var(--muted);font-weight:600;font-size:12px}
.auth-tabs button.active{background:#26372b;color:var(--green)}
.auth-form{display:grid;gap:12px}
.auth-form button[type=submit]{background:var(--green);color:#172012;border-radius:10px;padding:11px;font-weight:700;font-size:13px;margin-top:6px}
.auth-form button[type=submit]:disabled{opacity:.5}
.auth-msg{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;min-height:16px}
.auth-msg.error{color:var(--red)}
.auth-msg.success{color:var(--green)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:#101613ef;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brandmark{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#d9ffa0,#7cbd43);display:grid;place-items:center;color:#15200f;font-weight:900;font-size:16px;flex-shrink:0}
.brandname{font-weight:800;letter-spacing:.13em;font-size:12px}
.brandtag{font-size:9px;color:var(--muted);letter-spacing:.12em}
.nav-label{font-size:10px;color:#75837a;letter-spacing:.17em;text-transform:uppercase;padding:0 10px;margin-bottom:8px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#aebbb2;text-align:left;font-size:13px;border:1px solid transparent}
.nav button:hover{background:#202a24;color:white}
.nav button.active{background:linear-gradient(90deg,#293b2b,#202a24);border-color:#3c513e;color:var(--green)}
.nav button.disabled{opacity:.4;cursor:not-allowed}
.nav button .badge{font-size:9px;background:#3c3323;color:#f0ce8d;padding:2px 6px;border-radius:20px;margin-left:auto}
.sidebottom{margin-top:auto;border:1px solid var(--line);background:linear-gradient(145deg,#1b261f,#141a16);border-radius:14px;padding:14px}
.sidebottom .ws-name{font-size:12px;font-weight:700;margin-bottom:2px}
.sidebottom .ws-email{font-size:10px;color:var(--muted);margin-bottom:12px;word-break:break-all}
.sidebottom button{width:100%;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font-size:11px;font-weight:600}
main{min-width:0;padding:28px 32px 60px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--green);font-weight:800;margin-bottom:4px}
h1{font-size:26px;font-weight:750;letter-spacing:-.03em;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:#1a231d;color:var(--text);border-radius:9px;padding:9px 14px;font-weight:600;font-size:12px}
.btn:hover{border-color:#627b60}
.btn.primary{background:var(--green);border-color:var(--green);color:#172012}
.btn.danger{color:var(--red)}
.btn.small{padding:5px 9px;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{background:linear-gradient(145deg,#19211c,#141a16);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat-label{color:var(--muted);font-size:11px;margin-bottom:10px}
.stat-value{font-size:26px;font-weight:750;letter-spacing:-.03em}
.card{background:linear-gradient(145deg,#19211c,#141a16);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h3{font-size:13px;font-weight:700;margin-bottom:12px}
.empty{padding:50px 20px;text-align:center;color:var(--muted);background:linear-gradient(145deg,#19211c,#141a16);border:1px solid var(--line);border-radius:14px}
.empty .big{font-size:30px;margin-bottom:10px;color:var(--green)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
.table-wrap{overflow-x:auto;background:linear-gradient(145deg,#19211c,#141a16);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}
th{text-align:left;font-size:10px;color:#7f8e83;text-transform:uppercase;letter-spacing:.1em;padding:12px 16px;background:#151c17;font-weight:700}
td{padding:13px 16px;border-top:1px solid #27312b;color:#d9e2db;vertical-align:middle}
tbody tr:hover{background:#1d2720}
td.actions{display:flex;gap:4px}
.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#29342c;color:#c4d0c7;font-size:10px;font-weight:700;text-transform:capitalize}
.pill.green{background:#263d28;color:#bdf17c}
.pill.gold{background:#3c3323;color:#f0ce8d}
.pill.red{background:#40292a;color:#ffaaaa}
.pill.blue{background:#263448;color:#a8c9ff}
.muted{color:var(--muted)}
.modal-back{position:fixed;inset:0;background:#030605bd;backdrop-filter:blur(7px);z-index:50;display:none;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.modal-back.show{display:flex}
.modal{width:min(520px,100%);background:#17201a;border:1px solid #405044;border-radius:16px;padding:22px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;margin-bottom:16px}
.modal-form{display:grid;gap:11px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-row.full{grid-template-columns:1fr}
.field label{display:block;font-size:10px;color:#a5b2a9;font-weight:700;margin-bottom:5px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal-error{color:var(--red);font-size:12px;min-height:16px;margin-top:6px}
.toast{position:fixed;bottom:22px;right:22px;background:#d9ffa0;color:#172012;border-radius:10px;padding:11px 15px;font-size:12px;font-weight:700;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.show{transform:translateY(0);opacity:1}
.mobile-toggle{display:none;background:#1b241e;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 11px;font-size:14px}
@media(max-width:700px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:20;left:-260px;top:0;width:240px;height:100vh;transition:left .25s;box-shadow:var(--shadow)}
  .sidebar.open{left:0}
  .mobile-toggle{display:inline-flex;margin-right:8px}
  main{padding:18px 16px 50px}
  .page-head{flex-direction:column;align-items:flex-start}
  h1{font-size:22px}
  .form-row{grid-template-columns:1fr}
}
</style>
<!-- FIX: Using a highly reliable CDN and standard load -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<script>
window.onerror = function(msg, url, line) {
  document.getElementById('app').innerHTML = `<div style="color:white; background:red; padding:20px; font-family:sans-serif;">
    <h2>App Error</h2>
    <p>${msg}</p>
    <p>Line: ${line}</p>
  </div>`;
  return false;
};

try {
  const SUPABASE_URL = 'https://zxddvulbcpkrffboyrmm.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_WYXp6hLbWLBWHOv_WUwDsw__98aNKGz';

  if (typeof window.supabase === 'undefined') {
      throw new Error("Could not load Supabase library from the internet. Please check your connection.");
  }

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const state = { session:null, workspace:null, leads:[], view:'overview', loading:true,
    authTab:'login', authMsg:'', authMsgType:'', busy:false, modal:null, modalError:'', sidebarOpen:false };

  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}

  function render(){
    const app=document.getElementById('app');
    if(state.loading){app.innerHTML='<div class="loading">Connecting to Database…</div>';return}
    if(!state.session){app.innerHTML=renderAuth();bindAuth();return}
    app.innerHTML=renderApp();bindApp();if(state.modal)renderModal();
  }

  function renderAuth(){
    const isLogin=state.authTab==='login';
    return `
      <div class="auth-wrap"><div class="auth-card">
        <div class="auth-brand">CLIENTFLOW</div>
        <h1 class="auth-title">${isLogin?'Welcome back.':'Create your workspace.'}</h1>
        <div class="auth-tabs">
          <button data-tab="login" class="${isLogin?'active':''}">Login</button>
          <button data-tab="signup" class="${!isLogin?'active':''}">Sign up</button>
        </div>
        <form class="auth-form" id="authForm">
          <input type="email" name="email" placeholder="Email" required autocomplete="email">
          <input type="password" name="password" placeholder="Password (min 6)" required minlength="6" autocomplete="${isLogin?'current-password':'new-password'}">
          <button type="submit" ${state.busy?'disabled':''}>${state.busy?'Please wait…':(isLogin?'Log in':'Create account')}</button>
        </form>
        <div class="auth-msg ${state.authMsgType}" id="authMsg">${esc(state.authMsg)}</div>
      </div></div>`;
  }

  function renderApp(){
    const email=state.session.user.email||'';
    const wsName=state.workspace?state.workspace.name:'Loading…';
    return `
      <div class="app">
        <aside class="sidebar ${state.sidebarOpen?'open':''}" id="sidebar">
          <div class="brand"><div class="brandmark">C</div><div><div class="brandname">CLIENTFLOW</div><div class="brandtag">BUSINESS, IN FLOW.</div></div></div>
          <div>
            <div class="nav-label">Workspace</div>
            <nav class="nav">
              <button data-view="overview" class="${state.view==='overview'?'active':''}">◫ Overview</button>
              <button data-view="leads" class="${state.view==='leads'?'active':''}">◎ Leads</button>
              <button class="disabled" title="Coming soon">♙ Clients <span class="badge">soon</span></button>
              <button class="disabled" title="Coming soon">✓ Tasks <span class="badge">soon</span></button>
              <button class="disabled" title="Coming soon">▤ Invoices <span class="badge">soon</span></button>
              <button class="disabled" title="Coming soon">◇ Proposals <span class="badge">soon</span></button>
            </nav>
          </div>
          <div class="sidebottom">
            <div class="ws-name">${esc(wsName)}</div>
            <div class="ws-email">${esc(email)}</div>
            <button id="logout">Sign out</button>
          </div>
        </aside>
        <main>
          <div style="margin-bottom:18px"><button class="mobile-toggle" id="mobileToggle">☰</button></div>
          ${state.view==='overview'?renderOverview():renderLeads()}
        </main>
      </div>
      <div class="modal-back" id="modalBack"></div>`;
  }

  function renderOverview(){
    const leads=state.leads;
    const won=leads.filter(l=>l.status==='won').length;
    const pipeline=leads.filter(l=>!['won','lost'].includes(l.status)).reduce((s,l)=>s+Number(l.potential_value||0),0);
    const followups=leads.filter(l=>l.next_follow_up).length;
    return `
      <div class="page-head">
        <div>
          <div class="eyebrow">Workspace overview</div>
          <h1>Good work starts with clarity.</h1>
          <div class="sub">This is your real workspace — data lives in Supabase with tenant isolation.</div>
        </div>
        <button class="btn primary" id="addLeadFromOverview">+ Add lead</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-label">Total leads</div><div class="stat-value">${leads.length}</div></div>
        <div class="stat"><div class="stat-label">Won</div><div class="stat-value">${won}</div></div>
        <div class="stat"><div class="stat-label">Pipeline value</div><div class="stat-value">₹${pipeline.toLocaleString('en-IN')}</div></div>
        <div class="stat"><div class="stat-label">Follow-ups scheduled</div><div class="stat-value">${followups}</div></div>
      </div>
      <div class="card">
        <h3>Getting started</h3>
        <p style="color:var(--muted);font-size:13px;line-height:1.7">
          Your workspace is live and secured. Try adding a lead, reloading the page, and confirming it persists.
          Then open this URL in another browser, log in with a different account, and confirm you see an empty
          workspace — that proves tenant isolation is working. Clients, Tasks, Invoices and Proposals are next.
        </p>
      </div>`;
  }

  function renderLeads(){
    const leads=state.leads;
    return `
      <div class="page-head">
        <div>
          <div class="eyebrow">Workspace / Manage</div>
          <h1>Leads</h1>
          <div class="sub">Capture opportunities and keep follow-ups moving.</div>
        </div>
        <button class="btn primary" id="addLead">+ Add lead</button>
      </div>
      ${leads.length===0?`
        <div class="empty"><div class="big">✧</div><b>No leads yet</b><p>Add your first lead to get started.</p></div>
      `:`
        <div class="table-wrap"><table>
          <thead><tr><th>Contact</th><th>Company</th><th>Status</th><th>Value</th><th>Follow-up</th><th></th></tr></thead>
          <tbody>${leads.map(l=>`
            <tr>
              <td><b>${esc(l.name)}</b></td>
              <td>${esc(l.company||'—')}</td>
              <td>${statusPill(l.status)}</td>
              <td>₹${Number(l.potential_value||0).toLocaleString('en-IN')}</td>
              <td class="muted">${esc(l.next_follow_up||'—')}</td>
              <td class="actions">
                <button class="btn small" data-edit-lead="${esc(l.id)}">Edit</button>
                <button class="btn small danger" data-delete-lead="${esc(l.id)}">Delete</button>
              </td>
            </tr>`).join('')}</tbody>
        </table></div>
      `}`;
  }

  function statusPill(s){
    const cls=['won','paid','active','done','accepted'].includes(s)?'green'
      :['pending','sent','qualified','in_progress','viewed','contacted','partially_paid'].includes(s)?'gold'
      :['lost','overdue','declined','expired','cancelled'].includes(s)?'red':'blue';
    return `<span class="pill ${cls}">${esc((s||'').replace(/_/g,' '))}</span>`;
  }

  function bindAuth(){
    document.querySelectorAll('[data-tab]').forEach(btn=>{
      btn.addEventListener('click',()=>{state.authTab=btn.dataset.tab;state.authMsg='';state.authMsgType='';render()});
    });
    const form=document.getElementById('authForm');if(!form)return;
    form.addEventListener('submit',async e=>{
      e.preventDefault();if(state.busy)return;
      const fd=new FormData(form);const email=String(fd.get('email')||'').trim();const password=String(fd.get('password')||'');
      state.busy=true;state.authMsg='';state.authMsgType='';render();
      try{
        if(state.authTab==='login'){
          const {error}=await supabase.auth.signInWithPassword({email,password});
          if(error)throw error;
        }else{
          const {data,error}=await supabase.auth.signUp({email,password});
          if(error)throw error;
          if(data.session){state.authMsg='Account created. Loading workspace…';state.authMsgType='success'}
          else{state.authMsg='Account created. Check your email to confirm before logging in.';state.authMsgType='success'}
        }
      }catch(err){
        state.authMsg=err?.message||'Something went wrong.';state.authMsgType='error';
      }finally{state.busy=false;render()}
    });
  }

  function bindApp(){
    document.querySelectorAll('[data-view]').forEach(btn=>{
      btn.addEventListener('click',()=>{state.view=btn.dataset.view;state.sidebarOpen=false;render()});
    });
    const logout=document.getElementById('logout');
    if(logout)logout.addEventListener('click',async()=>{await supabase.auth.signOut()});
    const mt=document.getElementById('mobileToggle');
    if(mt)mt.addEventListener('click',()=>{state.sidebarOpen=!state.sidebarOpen;document.getElementById('sidebar').classList.toggle('open',state.sidebarOpen)});
    const a1=document.getElementById('addLead');if(a1)a1.addEventListener('click',()=>openModal(null));
    const a2=document.getElementById('addLeadFromOverview');if(a2)a2.addEventListener('click',()=>openModal(null));
    document.querySelectorAll('[data-edit-lead]').forEach(btn=>{
      btn.addEventListener('click',()=>{const lead=state.leads.find(l=>l.id===btn.dataset.editLead);if(lead)openModal(lead)});
    });
    document.querySelectorAll('[data-delete-lead]').forEach(btn=>{
      btn.addEventListener('click',()=>deleteLead(btn.dataset.deleteLead));
    });
  }

  function openModal(lead){state.modal={lead:lead||null};state.modalError='';renderModal()}
  function closeModal(){state.modal=null;state.modalError='';const mb=document.getElementById('modalBack');if(mb)mb.classList.remove('show')}

  function renderModal(){
    const mb=document.getElementById('modalBack');if(!mb)return;
    const editing=state.modal.lead;
    const l=editing||{name:'',company:'',email:'',phone:'',source:'',potential_value:'',status:'new',next_follow_up:'',notes:''};
    const statuses=['new','contacted','qualified','proposal_sent','won','lost'];
    mb.classList.add('show');
    mb.innerHTML=`
      <div class="modal">
        <h2>${editing?'Edit lead':'Add lead'}</h2>
        <form class="modal-form" id="leadForm">
          <div class="form-row">
            <div class="field"><label>Contact name *</label><input name="name" required value="${esc(l.name)}"></div>
            <div class="field"><label>Company</label><input name="company" value="${esc(l.company||'')}"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>Email</label><input type="email" name="email" value="${esc(l.email||'')}"></div>
            <div class="field"><label>Phone</label><input name="phone" value="${esc(l.phone||'')}"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>Source</label><input name="source" value="${esc(l.source||'')}"></div>
            <div class="field"><label>Potential value (₹)</label><input type="number" min="0" step="1" name="potential_value" value="${esc(l.potential_value||'')}"></div>
          </div>
          <div class="form-row">
            <div class="fie
